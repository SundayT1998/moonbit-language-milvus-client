syntax = "proto3";
package milvus.proto.msg;
option go_package="x";
import "common.proto";
// ---- Flush 响应所需的 MsgPosition（#17）----
// 逐条照抄 proto/upstream/msg.proto 的 MsgPosition，字段号不动。
// 裁剪集只留 FlushResponse.channel_cps 需要的那一个 message，
// msg.proto 的其余一大坨（InsertRequest / TimeTick 之类）客户端用不着。

message MsgPosition {
  string channel_name = 1;
  bytes msgID = 2;
  string msgGroup = 3;
  uint64 timestamp = 4;
  common.WALName WAL_name = 5;
}
