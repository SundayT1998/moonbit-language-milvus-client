syntax = "proto3";
package milvus.proto.common;
option go_package="x";
option java_multiple_files = true;
option java_package = "io.milvus.grpc";
option java_outer_classname = "CommonProto";
option java_generate_equals_and_hash = true;
option csharp_namespace = "Milvus.Client.Grpc";
message KeyDataPair {
    string key = 1;
    bytes data = 2;
}

message KeyValuePair {
    string key = 1;
    string value = 2;
}

message MsgBase {
    MsgType msg_type = 1;
    int64  msgID = 2;
    uint64 timestamp = 3;
    int64 sourceID = 4;
    int64 targetID = 5;
    map<string, string> properties = 6;
    ReplicateInfo replicateInfo = 7 [deprecated = true];
}

message ReplicateInfo {
    option deprecated = true;
    bool isReplicate = 1;
    uint64 msgTimestamp = 2;
    string replicateID = 3;
}

message Status {
    ErrorCode error_code = 1 [deprecated=true];
    string reason = 2;
    int32 code = 3;
    bool retriable = 4;
    string detail = 5;
    map<string, string> extra_info = 6;
}

enum IndexState {
    IndexStateNone = 0;
    Unissued = 1;
    InProgress = 2;
    Finished = 3;
    Failed = 4;
    Retry = 5;
}

enum ConsistencyLevel {
    Strong = 0;
    Session = 1; // default in PyMilvus
    Bounded = 2;
    Eventually = 3;
    Customized = 4; // Users pass their own `guarantee_timestamp`.
}

enum ErrorCode {
    option deprecated = true;
    Success = 0;
    UnexpectedError = 1;
    ConnectFailed = 2;
    PermissionDenied = 3;
    CollectionNotExists = 4;
    IllegalArgument = 5;
    IllegalDimension = 7;
    IllegalIndexType = 8;
    IllegalCollectionName = 9;
    IllegalTOPK = 10;
    IllegalRowRecord = 11;
    IllegalVectorID = 12;
    IllegalSearchResult = 13;
    FileNotFound = 14;
    MetaFailed = 15;
    CacheFailed = 16;
    CannotCreateFolder = 17;
    CannotCreateFile = 18;
    CannotDeleteFolder = 19;
    CannotDeleteFile = 20;
    BuildIndexError = 21;
    IllegalNLIST = 22;
    IllegalMetricType = 23;
    OutOfMemory = 24;
    IndexNotExist = 25;
    EmptyCollection = 26;
    UpdateImportTaskFailure = 27;
    CollectionNameNotFound = 28;
    CreateCredentialFailure = 29;
    UpdateCredentialFailure = 30;
    DeleteCredentialFailure = 31;
    GetCredentialFailure = 32;
    ListCredUsersFailure = 33;
    GetUserFailure = 34;
    CreateRoleFailure = 35;
    DropRoleFailure = 36;
    OperateUserRoleFailure = 37;
    SelectRoleFailure = 38;
    SelectUserFailure = 39;
    SelectResourceFailure = 40;
    OperatePrivilegeFailure = 41;
    SelectGrantFailure = 42;
    RefreshPolicyInfoCacheFailure = 43;
    ListPolicyFailure = 44;
    NotShardLeader = 45;
    NoReplicaAvailable = 46;
    SegmentNotFound = 47;
    ForceDeny = 48;
    RateLimit = 49;
    NodeIDNotMatch = 50;
    UpsertAutoIDTrue = 51;
    InsufficientMemoryToLoad = 52;
    MemoryQuotaExhausted = 53;
    DiskQuotaExhausted = 54;
    TimeTickLongDelay = 55;
    NotReadyServe = 56;
    // Coord is switching from standby mode to active mode
    NotReadyCoordActivating = 57;
    CreatePrivilegeGroupFailure = 58;
    DropPrivilegeGroupFailure = 59;
    ListPrivilegeGroupsFailure = 60;
    OperatePrivilegeGroupFailure = 61;
    SchemaMismatch = 62;
    // Service availability.
    // NA: Not Available.
    DataCoordNA = 100;

    // internal error code.
    DDRequestRace = 1000;
}

enum MsgType {
    Undefined = 0;
    /* DEFINITION REQUESTS: COLLECTION */
    CreateCollection = 100;
    DropCollection = 101;
    HasCollection = 102;
    DescribeCollection = 103;
    ShowCollections = 104;
    GetSystemConfigs = 105;
    LoadCollection = 106;
    ReleaseCollection = 107;
    CreateAlias = 108;
    DropAlias = 109;
    AlterAlias = 110;
    AlterCollection = 111;
    RenameCollection = 112;
    DescribeAlias = 113;
    ListAliases = 114;
    AlterCollectionField = 115;
    AddCollectionFunction = 116;
    AlterCollectionFunction = 117;
    DropCollectionFunction = 118;
    TruncateCollection = 119;
    // The legacy msgstream type the SplitShard WAL message maps to. Numbered
    // with the collection DDL above it, since it changes a collection's shard
    // set rather than administering the WAL.
    SplitShard = 120;

    /* DEFINITION REQUESTS: PARTITION */
    CreatePartition = 200;
    DropPartition = 201;
    HasPartition = 202;
    DescribePartition = 203;
    ShowPartitions = 204;
    LoadPartitions = 205;
    ReleasePartitions = 206;

    /* DEFINE REQUESTS: SEGMENT */
    ShowSegments = 250;
    DescribeSegment = 251;
    LoadSegments = 252;
    ReleaseSegments = 253;
    HandoffSegments = 254;
    LoadBalanceSegments = 255;
    DescribeSegments = 256;
    FederListIndexedSegment = 257;
    FederDescribeSegmentIndexData = 258;

    /* DEFINITION REQUESTS: INDEX */
    CreateIndex = 300;
    DescribeIndex = 301;
    DropIndex = 302;
    GetIndexStatistics = 303;
    AlterIndex = 304;

    /* MANIPULATION REQUESTS */
    Insert = 400;
    Delete = 401;
    Flush = 402;
    ResendSegmentStats = 403;
    Upsert = 404;
    ManualFlush = 405; // streaming service new msg type for internal usage compatible
    FlushSegment = 406; // streaming service new msg type for internal usage compatible
    CreateSegment = 407; // streaming service new msg type for internal usage compatible
    Import = 408;
    FlushAll = 409; // streaming service new msg type for internal usage compatible

    /* QUERY */
    Search = 500;
    SearchResult = 501;
    GetIndexState = 502;
    GetIndexBuildProgress = 503;
    GetCollectionStatistics = 504;
    GetPartitionStatistics = 505;
    Retrieve = 506;
    RetrieveResult = 507;
    WatchDmChannels = 508;
    RemoveDmChannels = 509;
    WatchQueryChannels = 510;
    RemoveQueryChannels = 511;
    SealedSegmentsChangeInfo = 512;
    WatchDeltaChannels = 513;
    GetShardLeaders = 514;
    GetReplicas = 515;
    UnsubDmChannel = 516;
    GetDistribution = 517;
    SyncDistribution = 518;
    RunAnalyzer = 519;

    /* DATA SERVICE */
    SegmentInfo = 600;
    SystemInfo = 601;
    GetRecoveryInfo = 602;
    GetSegmentState = 603;

    /* SYSTEM CONTROL */
    TimeTick = 1200;
    QueryNodeStats = 1201; // GOOSE TODO: Remove kQueryNodeStats
    LoadIndex = 1202;
    RequestID = 1203;
    RequestTSO = 1204;
    AllocateSegment = 1205;
    SegmentStatistics = 1206;
    SegmentFlushDone = 1207;

    DataNodeTt = 1208;
    Connect = 1209;
    ListClientInfos = 1210;
    AllocTimestamp = 1211;
    Replicate = 1212 [deprecated = true];

    /* Credential */
    CreateCredential = 1500;
    GetCredential = 1501;
    DeleteCredential = 1502;
    UpdateCredential = 1503;
    ListCredUsernames = 1504;

    /* RBAC */
    CreateRole = 1600;
    DropRole = 1601;
    OperateUserRole = 1602;
    SelectRole = 1603;
    SelectUser = 1604;
    SelectResource = 1605;
    OperatePrivilege = 1606;
    SelectGrant = 1607;
    RefreshPolicyInfoCache = 1608;
    ListPolicy = 1609;
    CreatePrivilegeGroup = 1610;
    DropPrivilegeGroup = 1611;
    ListPrivilegeGroups = 1612;
    OperatePrivilegeGroup = 1613;
    OperatePrivilegeV2 = 1614;
    AlterRole = 1615;


    /* Resource group */
    CreateResourceGroup = 1700;
    DropResourceGroup = 1701;
    ListResourceGroups = 1702;
    DescribeResourceGroup = 1703;
    TransferNode = 1704;
    TransferReplica = 1705;
    UpdateResourceGroups = 1706;

    /* Database group */
    CreateDatabase = 1801;
    DropDatabase = 1802;
    ListDatabases = 1803;
    AlterDatabase = 1804;
    DescribeDatabase = 1805;

    AddCollectionField = 1900;
    /* WAL group */
    AlterWAL = 2000;

    /* Snapshot */
    CreateSnapshot = 2100;
    DropSnapshot = 2101;
    ListSnapshots = 2102;
    DescribeSnapshot = 2103;
    RestoreSnapshot = 2104;
    GetRestoreSnapshotState = 2105;
    ListRestoreSnapshotJobs = 2106;
    PinSnapshotData = 2107;
    UnpinSnapshotData = 2108;
    RestoreExternalSnapshot = 2109;
    ExportSnapshot = 2110;

    AlterCollectionSchema = 2200;

    /* External Collection */
    RefreshExternalCollection = 2300;
    GetRefreshExternalCollectionProgress = 2301;
    ListRefreshExternalCollectionJobs = 2302;

    /* Row-Level Security */
    CreateRowPolicy = 2400;
    DropRowPolicy = 2401;
    ListRowPolicies = 2402;
    UpdateRowPolicy = 2403;
    SetRLSPrincipalTags = 2404;
    GetRLSPrincipalTags = 2405;
    ListRLSPrincipals = 2406;
    DeleteRLSPrincipalTags = 2407;

    /* Async Snapshot Export */
    GetExportSnapshotState = 2111;
}