name: Check and Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: install-ubuntu
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: install-windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: install-protoc-ubuntu
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: install-protoc-macos
        if: ${{ matrix.os == 'macos-latest' }}
        run: brew install protobuf

      - name: install-protoc-windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: choco install protoc -y

      - name: gen-proto
        # 生成物已入库（proto/milvus/proto），这一步是**校验生成可复现**：
        # 重跑一遍应当产生零 diff，否则说明有人手改了生成物或改了 .proto 没重新生成。
        # 与下面的 `moon fmt && git diff --exit-code` 是同一个套路。
        run: |
          bash proto/tools/gen.sh trimmed
          git diff --exit-code -- proto/milvus/proto

      - name: moon check
        run: moon check --target all

      - name: moon test
        run: moon test --target all

      - name: lint
        run: |
          moon fmt && git diff --exit-code
          moon info && git diff --exit-code

  # 真连 Milvus 的集成测试：起官方 standalone 容器 → 跑 cmd/integration → 停容器。
  # 只在 ubuntu 上跑：macOS/Windows 的 runner 上 docker 与 bash 脚本行为不一致，
  # 而这条链路的目的是验证「协议编排在真服务端上成立」，平台无关，
  # 挑一个平台跑够用；跨平台编译由上面的 build job 覆盖。
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install-ubuntu
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: install-protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: gen-proto
        run: |
          bash proto/tools/gen.sh trimmed
          git diff --exit-code -- proto/milvus/proto

      - name: start milvus
        run: scripts/milvus-start.sh --force

      - name: integration test
        # native-only 的包，模块默认 preferred_target 是 wasm，必须显式指 --target。
        run: moon run --target native cmd/integration -- 127.0.0.1:19530

      - name: stop milvus
        # 与 CNB 侧同理：成功失败都要收容器。GitHub Actions 里用 always()。
        if: always()
        run: scripts/milvus-stop.sh
