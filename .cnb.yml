# CNB 流水线：https://docs.cnb.cool
# 云原生构建（CI）与云原生开发（dev env）共用同一基础镜像 `.cnb/Dockerfile`
# MoonBit 工具链在 CNB 侧统一走中国站 https://cli.moonbitlang.cn
# 触发方式：push / pull_request 跑检查，vscode 事件进入开发环境

# 共用镜像：CI 与开发环境都从这里构建，保证环境一致
.docker: &docker
  build: .cnb/Dockerfile

# 共用检查步骤
.check: &check
  stages:
    - name: fmt-and-info
      script: |
        moon version --all
        moon update
        moon fmt
        git diff --exit-code
        moon info
        git diff --exit-code
    - name: check
      script: moon check --target all
    - name: test
      script: moon test --target all

main:
  push:
    - name: check-and-test
      docker:
        <<: *docker
      <<: *check
  pull_request:
    - name: check-and-test
      docker:
        <<: *docker
      <<: *check

"$":
  # 云原生开发环境：复用 CI 的同一份镜像
  vscode:
    - name: dev
      docker:
        <<: *docker
      services:
        - vscode
        - docker
      stages:
        - name: ready
          script: moon version --all
